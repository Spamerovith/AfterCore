[workspace]
resolver = "2"
members = [
    "crates/ac-core",
    "crates/ac-telemetry",
    "crates/ac-overlay",
    "crates/aftercore",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MIT"
authors = ["AfterCore"]

[workspace.dependencies]
ac-core = { path = "crates/ac-core" }
ac-telemetry = { path = "crates/ac-telemetry" }
ac-overlay = { path = "crates/ac-overlay" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
tiny-skia = "0.11"
ab_glyph = "0.2"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Etw",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Performance",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_UI_HiDpi",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev.package."*"]
opt-level = 2
